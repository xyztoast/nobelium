<!doctype html><html><head><meta charset="utf-8"><title>Nobelium tests</title>
<script>window.NOBELIUM_MANUAL=1</script>
<script src="src/lexer.js"></script><script src="src/parser.js"></script><script src="src/interpreter.js"></script><script src="src/runtime.js"></script>
<link rel="stylesheet" href="site/style.css"></head><body class="tests">
<h3>Nobelium tests (run in a real browser)</h3><div id="out"></div><div id="fx" class="fx"></div>
<script>
var out=document.getElementById('out'),fx=document.getElementById('fx'),logs=[];
Nobelium.config.log=function(l,m){logs.push(l+': '+m)};
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function click(s){document.querySelector(s).dispatchEvent(new MouseEvent('click',{bubbles:true}))}
function report(n,ok){var d=document.createElement('div');d.className=ok?'p':'f';d.textContent=(ok?'PASS ':'FAIL ')+n;out.appendChild(d)}
async function t(name,html,code,steps,check){fx.innerHTML=html;logs=[];var it=await Nobelium.run(code);if(steps)await steps();await sleep(30);var ok=false;try{ok=check(it)}catch(e){}report(name,ok);if(it)it.dispose()}
(async function(){
await t('toggle','<button id=b></button><p id=m style="display:none">x</p>','when click "#b" { toggle "#m" }',async function(){click('#b')},function(){return getComputedStyle(document.querySelector('#m')).display!=='none'});
await t('counter + variables','<i id=n>0</i><b id=b></b>','let c = 0\nwhen click "#b" { c = c + 1\nset text "#n" to c }',async function(){click('#b');await sleep(10);click('#b')},function(){return document.querySelector('#n').textContent==='2'});
await t('nested conditions','<i id=r></i>','let n = 5\nif n > 3 { if n < 10 { set text "#r" to "mid" } else { set text "#r" to "big" } }',null,function(){return document.querySelector('#r').textContent==='mid'});
await t('two listeners, one element','<b id=b></b><i id=r></i>','when click "#b" { set text "#r" to "a" }\nwhen click "#b" { add class "z" to "#r" }',async function(){click('#b')},function(){var r=document.querySelector('#r');return r.textContent==='a'&&r.classList.contains('z')});
await t('missing selector reports, no crash','','show "#nope"\nlog "alive"',null,function(){return logs.length===2&&/no element/.test(logs[0])});
await t('invalid syntax reports','','when click {',null,function(it){return it===null&&logs.length===1});
await t('runtime error isolated','<b id=b></b>','when click "#b" { log nope }\nwhen click "#b" { log "fine" }',async function(){click('#b')},function(){return logs.some(function(l){return /fine/.test(l)})&&logs.some(function(l){return /nope/.test(l)})});
await t('dynamic DOM','','when click ".x" { set text ".x" to "hi" }',async function(){var b=document.createElement('b');b.className='x';fx.appendChild(b);click('.x')},function(){return document.querySelector('.x').textContent==='hi'});
await t('functions','<i id=r></i><b id=b></b>','fn dbl(a) { return a * 2 }\nwhen click "#b" { set text "#r" to dbl(21) }',async function(){click('#b')},function(){return document.querySelector('#r').textContent==='42'});
await t('multiple blocks (separate runs)','<i id=r></i>','set text "#r" to "one"',async function(){await Nobelium.run('set text "#r" to "two"')},function(){return document.querySelector('#r').textContent==='two'});
await t('interpolation + lists + objects','<i id=r></i>','let o = { a: 1 }\no.a += 2\nlet xs = [5, 6]\npush(xs, 7)\nset text "#r" to "a={o.a} last={xs[-1]} n={len(xs)}"',null,function(){return document.querySelector('#r').textContent==='a=3 last=7 n=3'});
await t('for each + break','<i id=r></i>','let s = 0\nfor each x in [1, 2, 3, 4] {\n if x == 3 { break }\n s += x\n}\nset text "#r" to s',null,function(){return document.querySelector('#r').textContent==='3'});
await t('localStorage save / saved / forget','','save { n: 4 } as "tt"\nlog saved("tt").n\nforget "tt"\nlog saved("tt")\nclear storage',null,function(){return logs.join('|')==='log: 4|log: null'});
await t('timers: every + cancel, after','<i id=r></i>','let c = 0\nevery 20ms as t { c += 1\n set text "#r" to c\n if c == 2 { cancel t } }\nafter 10ms { log "later" }',async function(){await sleep(150)},function(){return document.querySelector('#r').textContent==='2'&&logs.join()==='log: later'});
await t('more events: dblclick, key combo','<b id=b></b>','when dblclick "#b" { log "dbl" }\nwhen key "ctrl+k" { stop\n log "combo" }',async function(){document.querySelector('#b').dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));document.dispatchEvent(new KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true}))},function(){return logs.indexOf('log: dbl')>=0&&logs.indexOf('log: combo')>=0});
await t('animate sets final css','<div id=b></div>','animate "#b" to { opacity: 0.5, width: 120 } over 80ms',async function(){await sleep(250)},function(){var b=document.querySelector('#b');return b.style.opacity==='0.5'&&b.style.width==='120px'});
Nobelium.files['t-lib.nbm']='export fn twice(n) { return n * 2 }\nexport let tag = "x"';
await t('import / export','<i id=r></i>','import twice, tag from "t-lib.nbm"\nset text "#r" to "{twice(21)}{tag}"',null,function(){return document.querySelector('#r').textContent==='42x'});
await t('import: missing export is an error','','import nope from "t-lib.nbm"',null,function(){return /does not export/.test(logs[0])});
var realFetch=window.fetch;
window.fetch=function(u,init){return Promise.resolve(new Response(JSON.stringify({id:9,m:init.method}),{status:201,headers:{'content-type':'application/json'}}))};
await t('http post + fetch','<i id=r></i>','post "/x" with { a: 1 } into d\nfetch "/y" into res\nset text "#r" to "{d.id}{d.m} {res.status} {res.ok}"',null,function(){return document.querySelector('#r').textContent==='9POST 201 true'});
window.fetch=function(){var e=new TextEncoder();return Promise.resolve(new Response(new ReadableStream({start:function(c){c.enqueue(e.encode('a\nb'));c.enqueue(e.encode('c\n'));c.close()}})))};
await t('stream lines','','stream "/s" with { lines: true } into l { log l }',null,function(){return logs.join('|')==='log: a|log: bc'});
window.fetch=realFetch;
})();
</script></body></html>
